<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — ydl</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ydl-theme")||"auto"}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%230a8f6f%27/%3E%3Cpath d=%27M12 5v9m0 0l-3-3m3 3l3-3M7 18h10%27 stroke=%27white%27 stroke-width=%272.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
:root{--bg:#f2efe7;--glow:rgba(10,143,111,.12);--surface:#fffdf8;--line:#e2dccd;--line2:#d3ccba;--text:#16202b;--muted:#5d6a79;--accent:#0a8f6f;--accent-ink:#fff;--bad:#c2334a;--bad-soft:rgba(194,51,74,.10);--blue:#2563eb;--shadow:0 1px 0 rgba(20,30,40,.04),0 18px 44px -22px rgba(20,30,40,.3)}
:root[data-theme=dark]{--bg:#0a0d12;--glow:rgba(52,224,176,.08);--surface:#111620;--line:#222b3a;--line2:#2d384b;--text:#e7ebf3;--muted:#8d97ab;--accent:#34e0b0;--accent-ink:#052a1f;--bad:#ff6b7a;--bad-soft:rgba(255,107,122,.12);--blue:#6aa7ff;--shadow:0 14px 40px -20px rgba(0,0,0,.8)}
@media (prefers-color-scheme:dark){:root:not([data-theme]),:root[data-theme=auto]{--bg:#0a0d12;--glow:rgba(52,224,176,.08);--surface:#111620;--line:#222b3a;--line2:#2d384b;--text:#e7ebf3;--muted:#8d97ab;--accent:#34e0b0;--accent-ink:#052a1f;--bad:#ff6b7a;--bad-soft:rgba(255,107,122,.12);--blue:#6aa7ff;--shadow:0 14px 40px -20px rgba(0,0,0,.8)}}
*{box-sizing:border-box}
html{color-scheme:light dark}html[data-theme=dark]{color-scheme:dark}html[data-theme=light]{color-scheme:light}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:radial-gradient(900px 480px at 10% -10%,var(--glow),transparent 60%),var(--bg)}
.card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 24px;box-shadow:var(--shadow)}
.mark{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--blue));color:var(--accent-ink);margin-bottom:16px}
.mark svg{width:23px;height:23px}
h1{font-size:20px;line-height:1.25;margin:0 0 4px;font-weight:650}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
.field{position:relative}
input[type=password],input[type=text]{width:100%;font:inherit;font-size:16px;padding:12px 44px 12px 14px;border:1px solid var(--line2);border-radius:11px;background:transparent;color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.eye{position:absolute;right:4px;top:4px;width:40px;height:40px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:9px;display:grid;place-items:center}
.eye:hover{color:var(--text)}
.eye svg{width:20px;height:20px}
.btn{width:100%;margin-top:14px;font:inherit;font-weight:600;font-size:15px;padding:12px;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.err{margin:0 0 14px;padding:9px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:14px}
.err:empty{display:none}
.hint{margin:16px 0 0;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg></div>
  <h1>Выгрузка Яндекс.Диска</h1>
  <p>Введите пароль, чтобы продолжить</p>
  <div class="err" role="alert">{{ERR}}</div>
  <input type="hidden" name="next" value="{{NEXT}}">
  <div class="field">
    <input id="pw" type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
    <button class="eye" type="button" id="eye" aria-label="Показать пароль" title="Показать пароль"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <button class="btn" type="submit">Войти</button>
  <div class="hint">Забыли пароль? На сервере выполните <b>./ydl password</b></div>
</form>
<script>
document.getElementById('eye').onclick=function(){var i=document.getElementById('pw');i.type=i.type==='password'?'text':'password';i.focus()};
</script>
</body>
</html>
