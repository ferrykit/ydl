<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Файлы — ydl</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("ydl-theme")||"auto"}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%276%27 fill=%27%230a8f6f%27/%3E%3Cpath d=%27M12 5v9m0 0l-3-3m3 3l3-3M7 18h10%27 stroke=%27white%27 stroke-width=%272.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2efe7;--glow:rgba(10,143,111,.10);--surface:#fffdf8;--surface2:#f8f5ec;--line:#e2dccd;--line2:#d3ccba;--text:#16202b;--muted:#5d6a79;--faint:#8a95a3;--accent:#0a8f6f;--accent-soft:rgba(10,143,111,.12);--accent-ink:#fff;--blue:#2563eb;--warn:#b45309;--warn-soft:rgba(180,83,9,.11);--bad:#c2334a;--bad-soft:rgba(194,51,74,.10);--shadow:0 1px 0 rgba(20,30,40,.04),0 10px 30px -18px rgba(20,30,40,.25);--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
:root[data-theme=dark]{--bg:#0a0d12;--glow:rgba(52,224,176,.07);--surface:#111620;--surface2:#151b27;--line:#222b3a;--line2:#2d384b;--text:#e7ebf3;--muted:#8d97ab;--faint:#5c677c;--accent:#34e0b0;--accent-soft:rgba(52,224,176,.12);--accent-ink:#052a1f;--blue:#6aa7ff;--warn:#ffb454;--warn-soft:rgba(255,180,84,.12);--bad:#ff6b7a;--bad-soft:rgba(255,107,122,.12);--shadow:0 14px 34px -20px rgba(0,0,0,.7)}
@media (prefers-color-scheme:dark){:root:not([data-theme]),:root[data-theme=auto]{--bg:#0a0d12;--glow:rgba(52,224,176,.07);--surface:#111620;--surface2:#151b27;--line:#222b3a;--line2:#2d384b;--text:#e7ebf3;--muted:#8d97ab;--faint:#5c677c;--accent:#34e0b0;--accent-soft:rgba(52,224,176,.12);--accent-ink:#052a1f;--blue:#6aa7ff;--warn:#ffb454;--warn-soft:rgba(255,180,84,.12);--bad:#ff6b7a;--bad-soft:rgba(255,107,122,.12);--shadow:0 14px 34px -20px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{color-scheme:light dark}html[data-theme=dark]{color-scheme:dark}html[data-theme=light]{color-scheme:light}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;background:radial-gradient(1100px 520px at 8% -12%,var(--glow),transparent 60%),var(--bg)}
.shell{max-width:1000px;margin:0 auto;padding:18px 16px 80px}
a{color:inherit}
button,input{font:inherit}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:19px;margin:0;font-weight:650;flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 14px;font-weight:550;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.bad{color:var(--bad)}.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.crumbs{display:flex;flex-wrap:wrap;gap:2px 4px;align-items:center;font-size:14px;margin-bottom:12px;color:var(--muted)}
.crumbs a{color:var(--accent);text-decoration:none;font-weight:550;overflow-wrap:anywhere}.crumbs a:hover{text-decoration:underline}
.crumbs b{color:var(--text);font-weight:600;overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.tools input[type=search]{flex:1;min-width:140px;border:1px solid var(--line2);background:var(--surface2);color:var(--text);border-radius:9px;padding:8px 11px}
.tools .sp{flex:1}
.info{display:flex;gap:6px 14px;flex-wrap:wrap;padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);align-items:center}
.info .lk{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:600;font-size:13px}
.info .lk:hover{text-decoration:underline}
.list{display:block}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) 92px 130px;gap:0 8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.head{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface2);border-radius:14px 14px 0 0;padding-top:9px;padding-bottom:9px}
.row.head button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;text-align:left}
.row.head button:hover{color:var(--text)}
.row:not(.head):hover{background:var(--surface2)}
.row.sel{background:var(--accent-soft)}
.row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.nm{min-width:0;overflow-wrap:anywhere}
.nm a{text-decoration:none;font-weight:500}.nm a:hover{text-decoration:underline}
.nm .ic{display:inline-block;width:20px;text-align:center;margin-right:4px}
.nm .tag{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 8px;margin-left:6px;background:var(--accent-soft);color:var(--accent)}
.nm .tag.w{background:var(--warn-soft);color:var(--warn)}
.nm .path{display:block;font-size:12px;color:var(--faint)}
.nm .acts{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.sz,.dt{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.empty{padding:34px 12px;text-align:center;color:var(--faint)}
.jobs{margin-bottom:14px;display:grid;gap:8px}
.job{padding:10px 14px;display:grid;gap:6px}
.job .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.job .t b{overflow-wrap:anywhere}
.job .st{font-size:13px;color:var(--muted)}
.job .st.err{color:var(--bad)}
.bar{height:7px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.job .a{display:flex;gap:8px;flex-wrap:wrap}
#dm{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.6);backdrop-filter:blur(5px);display:grid;place-items:center;padding:14px}
#dm[hidden]{display:none}
#dm .dlg{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);max-height:92vh;overflow:auto}
#dm h2{margin:0 0 10px;font-size:18px}
.dml{font-size:14px;margin-bottom:6px}.dml div{overflow-wrap:anywhere;padding:2px 0}
.dms{font-family:var(--mono);font-size:13px;color:var(--muted);margin-bottom:10px}
.dmn{font-size:13.5px;color:var(--muted);margin:0 0 12px}
.dmc{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer;margin-bottom:14px}.dmc input{width:18px;height:18px;margin-top:2px;accent-color:var(--bad)}
.dma{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn.bad:not(:disabled){border-color:var(--bad)}
#dmgo:not(:disabled){background:var(--bad);color:#fff;border-color:transparent}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:11px;font-size:14px;max-width:calc(100vw - 32px);display:none;z-index:9}
@media (max-width:640px){
 .shell{padding:12px 10px 80px}
 .row{grid-template-columns:30px minmax(0,1fr) auto;grid-template-areas:"c n s" ". d d";padding:9px 10px}
 .row>:nth-child(1){grid-area:c}.row>:nth-child(2){grid-area:n}.row>:nth-child(3){grid-area:s}.row>:nth-child(4){grid-area:d;text-align:left;font-size:11.5px;color:var(--faint)}
 .row.head{display:none}
 .btn{padding:10px 14px}.btn.sm{padding:7px 11px}
 .tools input[type=search]{min-width:0;width:100%;flex:1 1 100%}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>Файлы</h1>
    <a class="btn" href="/">← К загрузкам</a>
  </header>

  <div id="jobs" class="jobs"></div>

  <nav class="crumbs" id="crumbs" aria-label="Путь"></nav>

  <section class="panel">
    <div class="tools">
      <input type="search" id="q" placeholder="Фильтр по имени в этой папке…" autocomplete="off">
      <button class="btn" id="bfind" title="Искать по всем папкам (Enter)">Искать везде</button>
      <button class="btn" id="bmk">＋ Папка</button>
      <button class="btn primary" id="barch">Архивировать</button>
      <button class="btn bad" id="bdel" disabled>Удалить</button>
    </div>
    <div class="info" id="info"></div>
    <div class="list" id="list"></div>
  </section>
</div>
<div id="dm" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dmt">
    <h2 id="dmt">Удалить с сервера?</h2>
    <div id="dml" class="dml"></div>
    <div id="dms" class="dms"></div>
    <p class="dmn">Удаляется <b>навсегда</b>, вернуть будет нельзя. Если это скачано с Яндекс.Диска, оно будет <b>исключено из загрузки</b> (ydl не станет качать его снова, вернуть можно в «Выбрать файлы» на главной). Если удаляете папку ссылки целиком, сама ссылка тоже уберётся из списка.</p>
    <label class="dmc"><input type="checkbox" id="dmok"> Я скопировал(а) нужное себе или оно мне не нужно</label>
    <div class="dma"><button class="btn" id="dmx">Отмена</button><button class="btn bad" id="dmgo" disabled>Удалить навсегда</button></div>
  </div>
</div>
<div id="toast"></div>

<script>
(()=>{const f=window.fetch;window.fetch=(u,o)=>{o=o||{};if((o.method||'GET').toUpperCase()!=='GET'){o.headers=Object.assign({'X-YDL':'1'},o.headers||{})}return f(u,o)}})();
const $=id=>document.getElementById(id);
const MB=1048576;
let cur='/',ents=[],sel=new Set(),sortKey='n',sortDir=1,filter='',free=0,mode='dir',results=[],jobs=[],prev={},poll=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(b){if(b>=1073741824)return(b/1073741824).toFixed(2).replace('.',',')+' ГБ';if(b>=MB)return(b/MB).toFixed(1).replace('.',',')+' МБ';if(b>=1024)return Math.round(b/1024)+' КБ';return b+' Б'}
function fdate(t){const d=new Date(t*1000);return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500)}
function hrefOf(p,isDir){return '/files'+p.split('/').map(encodeURIComponent).join('/')+(isDir&&p!=='/'?'/':'')}
function pathFromUrl(){const p=location.pathname.replace(/^\/files/,'');const segs=p.split('/').filter(Boolean).map(decodeURIComponent);return '/'+segs.join('/')}
const join=(d,n)=>(d==='/'?'':d)+'/'+n;
const parentOf=p=>{const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i)};
const baseOf=p=>p.slice(p.lastIndexOf('/')+1);

async function api(url,opt){
  const r=await fetch(url,opt);
  if(r.status===401){location.href='/login?next='+encodeURIComponent(location.pathname);throw new Error('auth')}
  let d={};try{d=await r.json()}catch(e){}
  if(!r.ok)throw new Error(d.error||('Ошибка '+r.status));
  return d}
const post=(url,body)=>api(url,{method:'POST',body:body===undefined?'':JSON.stringify(body)});

async function go(p,push=true){
  mode='dir';sel.clear();filter='';$('q').value='';
  try{const d=await api('/api/ls?path='+encodeURIComponent(p));cur=d.path;ents=d.entries;free=d.free}
  catch(e){if(e.message!=='auth')toast(e.message);return}
  if(push)history.pushState(null,'',hrefOf(cur,true));
  document.title=(cur==='/'?'Файлы':baseOf(cur))+' — ydl';
  render()}

function crumbs(){
  const segs=cur.split('/').filter(Boolean);let acc='';
  let h=segs.length?'<a href="/files/" data-p="/">Корень</a>':'<b>Корень</b>';
  segs.forEach((s,i)=>{acc+='/'+s;h+=' <span>/</span> '+(i===segs.length-1?'<b>'+esc(s)+'</b>':'<a href="'+hrefOf(acc,true)+'" data-p="'+esc(acc)+'">'+esc(s)+'</a>')});
  $('crumbs').innerHTML=mode==='find'?'<a href="'+hrefOf(cur,true)+'" data-p="'+esc(cur)+'">← назад к папке</a> <span>/</span> <b>Результаты поиска</b>':h}

function sorted(){
  const f=filter.toLowerCase();
  const a=ents.filter(e=>!f||e.n.toLowerCase().includes(f));
  a.sort((x,y)=>{if(x.d!==y.d)return x.d?-1:1;let v;
    if(sortKey==='n')v=x.n.localeCompare(y.n,'ru',{numeric:true,sensitivity:'base'});else if(sortKey==='s')v=x.s-y.s;else v=x.t-y.t;
    return v*sortDir});
  return a}

function render(){
  crumbs();
  const arch=$('barch');
  if(mode==='find'){
    $('bmk').disabled=true;arch.disabled=true;$('bdel').disabled=true;$('info').innerHTML='Найдено: '+results.length;
    $('list').innerHTML=results.length?results.map(r=>'<div class="row"><span></span><div class="nm"><span class="ic">'+(r.d?'📁':'📄')+'</span><a href="'+hrefOf(r.p,r.d)+'" '+(r.d?'data-p="'+esc(r.p)+'"':'')+'>'+esc(baseOf(r.p))+'</a><span class="path">'+esc(parentOf(r.p))+'</span></div><span class="sz">'+(r.d?'':fmt(r.s))+'</span><span class="dt"></span></div>').join(''):'<div class="empty">Ничего не найдено</div>';
    return}
  $('bmk').disabled=false;
  const rows=sorted();
  arch.disabled=false;
  arch.textContent=sel.size?'Архивировать выбранное ('+sel.size+')':(cur==='/'?'Архивировать…':'Архивировать эту папку');
  arch.disabled=!sel.size&&cur==='/';
  $('bdel').disabled=!sel.size;
  const mark=k=>sortKey===k?(sortDir>0?' ▲':' ▼'):'';
  let h='<div class="row head"><input type="checkbox" id="all" title="Выбрать всё"><button data-s="n">Имя'+mark('n')+'</button><button data-s="s" style="text-align:right">Размер'+mark('s')+'</button><button data-s="t" style="text-align:right">Изменён'+mark('t')+'</button></div>';
  if(cur!=='/')h+='<div class="row"><span></span><div class="nm"><span class="ic">⬑</span><a href="'+hrefOf(parentOf(cur),true)+'" data-p="'+esc(parentOf(cur))+'">наверх</a></div><span></span><span></span></div>';
  rows.forEach(e=>{
    const p=join(cur,e.n),on=sel.has(e.n);
    let tag='',acts='';
    if(e.a){tag='<span class="tag">архив</span>';acts='<span class="acts"><a class="btn sm" href="'+hrefOf(p,false)+'" download>Скачать</a><button class="btn sm bad" data-del="'+e.a+'" data-name="'+esc(e.n)+'">Удалить архив</button></span>'}
    if(e.p)tag='<span class="tag w">скачивается…</span>';
    h+='<div class="row'+(on?' sel':'')+'"><input type="checkbox" data-n="'+esc(e.n)+'"'+(on?' checked':'')+'><div class="nm"><span class="ic">'+(e.d?'📁':e.a?'🗜':'📄')+'</span><a href="'+hrefOf(p,e.d)+'" '+(e.d?'data-p="'+esc(p)+'"':'')+'>'+esc(e.n)+'</a>'+tag+acts+'</div><span class="sz">'+(e.d?'':fmt(e.s))+'</span><span class="dt">'+fdate(e.t)+'</span></div>'});
  if(!rows.length)h+='<div class="empty">'+(ents.length?'Ничего не найдено по фильтру':'Папка пуста')+'</div>';
  $('list').innerHTML=h;
  const all=$('all');if(all){all.checked=rows.length>0&&rows.every(e=>sel.has(e.n));all.onchange=()=>{rows.forEach(e=>all.checked?sel.add(e.n):sel.delete(e.n));render()}}
  info()}

function info(){
  let h='Свободно на диске: <b>'+fmt(free)+'</b>';
  if(sel.size)h+='<span>Выбрано: <b>'+sel.size+'</b></span><button class="lk" id="bsize">Посчитать размер</button><span id="szres"></span>';
  $('info').innerHTML=h;
  const b=$('bsize');if(b)b.onclick=async()=>{$('szres').textContent='считаю…';try{const d=await post('/api/size',{dir:cur,names:[...sel]});$('szres').textContent='≈ '+fmt(d.bytes)+', файлов: '+d.files+(d.partial?' (подсчёт неполный)':'')}catch(e){$('szres').textContent=e.message}}}

async function find(){
  const q=$('q').value.trim();if(q.length<2){toast('Введите хотя бы 2 символа');return}
  $('info').textContent='Ищу…';
  try{const d=await api('/api/find?q='+encodeURIComponent(q));results=d.results;mode='find';render();if(d.partial)$('info').textContent='Найдено: '+results.length+' (показаны первые, уточните запрос)'}catch(e){if(e.message!=='auth')toast(e.message)}}

async function archive(){
  let dir=cur,names=[...sel];
  if(!names.length){if(cur==='/')return;dir=parentOf(cur);names=[baseOf(cur)]}
  try{await post('/api/archive',{dir,names});toast('Архив поставлен в очередь');sel.clear();loadJobs();render()}catch(e){toast(e.message)}}

async function mkdir(){
  const n=prompt('Имя новой папки');if(!n)return;
  try{await post('/api/mkdir',{dir:cur,name:n});go(cur,false)}catch(e){toast(e.message)}}

async function delArch(id,name){
  if(!confirm('Удалить архив «'+name+'»?\nИсходные файлы не будут затронуты.'))return;
  try{await post('/api/archive/delete?id='+id);toast('Архив удалён');loadJobs();go(cur,false)}catch(e){toast(e.message)}}

function openDelete(){
  const names=[...sel];if(!names.length)return;
  const shown=names.slice(0,8).map(n=>'<div>'+(ents.find(e=>e.n===n&&e.d)?'📁':'📄')+' '+esc(n)+'</div>').join('')+(names.length>8?'<div>…и ещё '+(names.length-8)+'</div>':'');
  $('dml').innerHTML=shown;$('dms').textContent='считаю размер…';$('dmok').checked=false;$('dmgo').disabled=true;$('dm').hidden=false;
  post('/api/size',{dir:cur,names}).then(d=>{$('dms').textContent='Будет удалено: '+names.length+' элем., файлов: '+d.files+', ≈ '+fmt(d.bytes)+(d.partial?' (подсчёт неполный)':'')}).catch(()=>{$('dms').textContent=''})}
function closeDelete(){$('dm').hidden=true}
async function doDelete(){
  const names=[...sel];$('dmgo').disabled=true;$('dmgo').textContent='Удаляю…';
  try{const d=await post('/api/delete',{dir:cur,names,confirm:true});
    toast('Удалено: '+d.deleted.length+', освобождено ≈ '+fmt(d.freed)+(d.removed_links.length?'. Ссылка убрана из списка: '+d.removed_links.join(', '):'')+(d.errors.length?'. Ошибки: '+d.errors.join('; '):''));
    closeDelete();sel.clear();loadJobs();go(cur,false)}
  catch(e){toast(e.message)}
  $('dmgo').textContent='Удалить навсегда'}
$('bdel').onclick=openDelete;$('dmx').onclick=closeDelete;$('dmgo').onclick=doDelete;
$('dmok').onchange=()=>{$('dmgo').disabled=!$('dmok').checked};
$('dm').addEventListener('click',e=>{if(e.target===$('dm'))closeDelete()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('dm').hidden)closeDelete()});
async function cancelJob(id){try{await post('/api/archive/cancel?id='+id);loadJobs()}catch(e){toast(e.message)}}

const ACTIVE=['в очереди','считаю','собираю'];
function jobsHtml(){
  return jobs.map(j=>{
    const act=ACTIVE.includes(j.status),pct=j.bytes_total?Math.min(100,Math.round(j.bytes_done*100/j.bytes_total)):(j.status==='готов'?100:0);
    let st=j.status;
    if(j.status==='собираю')st='собирается: '+pct+'% · '+fmt(j.bytes_done)+' из '+fmt(j.bytes_total)+' · файлов '+j.files_done+' из '+j.files_total;
    else if(j.status==='считаю')st='считаю файлы…';
    else if(j.status==='готов')st='готов, '+fmt(j.size)+' · лежит в папке «'+esc(j.dir==='/'?'Корень':baseOf(j.dir))+'»';
    else if(j.status==='ошибка')st='ошибка: '+esc(j.error);
    return '<div class="panel job"><div class="t"><span>🗜</span><b>'+esc(j.out_name)+'</b><span class="st'+(j.status==='ошибка'?' err':'')+'">'+st+'</span></div>'+(act?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'')+
      '<div class="a">'+(act?'<button class="btn sm" data-cancel="'+j.id+'">Отменить</button>':'')+(j.status==='готов'?'<a class="btn sm primary" href="'+hrefOf(j.out,false)+'" download>Скачать</a><a class="btn sm" href="'+hrefOf(j.dir,true)+'" data-p="'+esc(j.dir)+'">Показать папку</a><button class="btn sm bad" data-del="'+j.id+'" data-name="'+esc(j.out_name)+'">Удалить архив</button>':'')+(!act&&j.status!=='готов'?'<button class="btn sm" data-del="'+j.id+'" data-name="'+esc(j.out_name)+'">Убрать</button>':'')+'</div></div>'}).join('')}

async function loadJobs(){
  try{jobs=(await api('/api/archives')).jobs}catch(e){return}
  $('jobs').innerHTML=jobsHtml();
  let fin=false;jobs.forEach(j=>{if(prev[j.id]&&ACTIVE.includes(prev[j.id])&&j.status==='готов')fin=true;prev[j.id]=j.status});
  if(fin)go(cur,false);
  const any=jobs.some(j=>ACTIVE.includes(j.status));
  if(any&&!poll)poll=setInterval(loadJobs,1500);
  if(!any&&poll){clearInterval(poll);poll=null}}

document.addEventListener('click',e=>{
  const a=e.target.closest('a[data-p]');
  if(a&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey&&e.button===0){e.preventDefault();go(a.dataset.p)}
  const d=e.target.closest('[data-del]');if(d)delArch(d.dataset.del,d.dataset.name);
  const c=e.target.closest('[data-cancel]');if(c)cancelJob(c.dataset.cancel);
  const s=e.target.closest('[data-s]');if(s){const k=s.dataset.s;if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1}render()}});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.n!==undefined){t.checked?sel.add(t.dataset.n):sel.delete(t.dataset.n);render()}});
$('q').addEventListener('input',e=>{if(mode==='dir'){filter=e.target.value;render()}});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')find()});
$('bfind').onclick=find;$('bmk').onclick=mkdir;$('barch').onclick=archive;
window.addEventListener('popstate',()=>go(pathFromUrl(),false));
go(pathFromUrl(),false);loadJobs();
</script>
