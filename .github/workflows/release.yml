name: Release image

# Публикует образ в GitHub Container Registry при создании тега вида v1.2.3
# (тег должен совпадать с содержимым файла app/VERSION, например VERSION=1.2.3 -> тег v1.2.3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches app/VERSION
        run: |
          test "v$(cat app/VERSION)" = "$GITHUB_REF_NAME" || { echo "Тег $GITHUB_REF_NAME не совпадает с app/VERSION ($(cat app/VERSION))"; exit 1; }

      - name: Run tests before publishing
        run: |
          python3 -m unittest discover -s tests
          bash tests/test_shell.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
